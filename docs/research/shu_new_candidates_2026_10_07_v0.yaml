# ============================================================
# 蜀国新增人物卡 · 提案草案（**不是真源，不要提交到 data/**）
# ============================================================
# 本文件只用于「设计评审」：把建议的卡写成与 data/cards.yaml 同构的 YAML，
# 由 docs/research/_check_proposals.ts 逐条核对
#   · 卡级/技能级字段是否都在白名单里
#   · action 是否都在 core/src/effects.ts 的 IMPLEMENTED_ACTIONS 里
#   · status / 触发时机 / selector 字段 / filter.card_id / summon 单位是否已注册
#   · ⚠️ 另有一条「静默空转」黑名单（见文件末尾注释）：引擎实现了字段但**不读它**的组合
# 通过 ≠ 平衡通过（数值另见 docs/research/_pricing.py 的粗略定价），
# 但「写不出来的效果」会被当场拦下。
# ============================================================

- id: shu_xushu
  name: 徐庶
  faction: shu
  type: strategist
  cost: 3
  attack: 1
  health: 2
  keywords: []
  gender: male
  memo: 举荐卧龙的那张嘴；进了曹营，便再无一字
  note: 徐庶在《三国志》中**无本传**，三条素材分别出自诸葛亮传（举荐、辞别）与董和传（直谏评价）
  skills:
  - id: ju_jian
    name: 举荐
    kind: trigger
    trigger: on_play
    text: 战吼：使一名友方武将永久 +1 攻 / +1 血。
    effects:
    - action: modify
      attack: 1
      health: 1
      target:
        side: ally
        filter:
          type: general
        count: 1
        mode: choose
  - id: zuo_gong
    name: 佐公
    kind: trigger
    trigger: on_lord_skill_used
    text: 每当己方主公技结算后，抽 1 张牌。
    effects:
    - action: draw
      value: 1
  flavor: 本欲与将军共图王霸之业者，以此方寸之地也。今已失老母，方寸乱矣。

- id: shu_qiaozhou
